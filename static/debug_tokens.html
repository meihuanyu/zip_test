<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tokens 调试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        .input-section {
            margin-bottom: 30px;
        }
        label {
            display: block;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
            min-width: 120px;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn.stop {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }
        .status {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: bold;
        }
        .status.recording {
            background: #ffe8e8;
            color: #e74c3c;
        }
        .status.ready {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .tokens-display {
            padding: 20px;
            background: #f5f7ff;
            border-radius: 8px;
            max-height: 600px;
            overflow-y: auto;
        }
        .token-item {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            font-family: 'Courier New', monospace;
        }
        .token-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
            color: #666;
        }
        .token-content {
            font-size: 16px;
            color: #333;
            word-break: break-all;
        }
        .token-id {
            font-weight: bold;
            color: #667eea;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 8px;
        }
        .stat-item {
            flex: 1;
            text-align: center;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        .error {
            color: #e74c3c;
            margin-top: 20px;
            padding: 10px;
            background: #ffe8e8;
            border-radius: 8px;
            display: none;
        }
        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 New Tokens 调试页面</h1>
        
        <div class="input-section">
            <label for="textInput">输入参考文本（可选）：</label>
            <textarea id="textInput" placeholder="请输入参考文本（用于对齐测试）..."></textarea>
        </div>
        
        <div class="controls">
            <button class="btn" id="recordBtn">开始录音</button>
            <button class="btn stop" id="stopBtn" disabled>停止录音</button>
        </div>
        
        <div class="status ready" id="status">准备就绪</div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">本次新增 Tokens</div>
                <div class="stat-value" id="newTokensCount">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">累计总 Tokens</div>
                <div class="stat-value" id="totalTokensCount">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">当前时间</div>
                <div class="stat-value" id="currentTime">0.00s</div>
            </div>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="tokens-display" id="tokensDisplay">
            <div class="empty-state">开始录音后，new_tokens 将实时显示在这里</div>
        </div>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('status');
        const tokensDisplay = document.getElementById('tokensDisplay');
        const error = document.getElementById('error');
        const newTokensCount = document.getElementById('newTokensCount');
        const totalTokensCount = document.getElementById('totalTokensCount');
        const currentTimeEl = document.getElementById('currentTime');
        
        let mediaRecorder = null;
        let audioContext = null;
        let websocket = null;
        let isRecording = false;
        let tokenList = [];
        
        async function initAudio() {
            try {
                console.log('[前端] 请求麦克风权限...');
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                console.log('[前端] 麦克风权限已获取');
                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: 16000
                });
                console.log('[前端] AudioContext创建成功, 采样率:', audioContext.sampleRate);
                
                const source = audioContext.createMediaStreamSource(stream);
                const processor = audioContext.createScriptProcessor(4096, 1, 1);
                
                let audioChunkCount = 0;
                processor.onaudioprocess = (e) => {
                    if (isRecording && websocket && websocket.readyState === WebSocket.OPEN) {
                        const inputData = e.inputBuffer.getChannelData(0);
                        const pcm16 = new Int16Array(inputData.length);
                        for (let i = 0; i < inputData.length; i++) {
                            const s = Math.max(-1, Math.min(1, inputData[i]));
                            pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                        }
                        websocket.send(pcm16.buffer);
                        audioChunkCount++;
                    }
                };
                
                source.connect(processor);
                processor.connect(audioContext.destination);
                console.log('[前端] 音频处理器已连接');
                
                return true;
            } catch (err) {
                console.error('[前端] 初始化音频失败:', err);
                showError('无法访问麦克风: ' + err.message);
                return false;
            }
        }
        
        function showError(msg) {
            error.textContent = msg;
            error.style.display = 'block';
        }
        
        function hideError() {
            error.style.display = 'none';
        }
        
        function addTokenItem(tokens, timestamp) {
            if (tokensDisplay.querySelector('.empty-state')) {
                tokensDisplay.innerHTML = '';
            }
            
            const tokenItem = document.createElement('div');
            tokenItem.className = 'token-item';
            
            const header = document.createElement('div');
            header.className = 'token-header';
            header.innerHTML = `
                <span>时间: ${timestamp.toFixed(2)}s</span>
                <span>数量: ${tokens.length}</span>
            `;
            
            const content = document.createElement('div');
            content.className = 'token-content';
            const tokensHtml = tokens.map((token, idx) => {
                const tokenId = typeof token === 'number' ? token : 'N/A';
                const tokenStr = typeof token === 'string' ? token : `Token[${tokenId}]`;
                return `<span class="token-id">[${tokenId}]</span> ${tokenStr}`;
            }).join(' | ');
            content.innerHTML = tokensHtml;
            
            tokenItem.appendChild(header);
            tokenItem.appendChild(content);
            
            tokensDisplay.insertBefore(tokenItem, tokensDisplay.firstChild);
            
            // 限制显示数量，最多保留 100 条
            const items = tokensDisplay.querySelectorAll('.token-item');
            if (items.length > 100) {
                items[items.length - 1].remove();
            }
        }
        
        async function startRecording() {
            console.log('[前端] 开始录音...');
            const text = textInput.value.trim();
            
            if (!audioContext) {
                console.log('[前端] 初始化音频上下文...');
                const success = await initAudio();
                if (!success) {
                    console.log('[前端] 音频初始化失败');
                    return;
                }
            }
            
            try {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/api/alignment/ws`;
                console.log('[前端] 连接WebSocket:', wsUrl);
                websocket = new WebSocket(wsUrl);
                
                websocket.onopen = () => {
                    console.log('[前端] WebSocket连接已建立');
                    websocket.send(JSON.stringify({ text: text || "" }));
                };
                
                websocket.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    console.log('[前端] 收到消息:', data);
                    
                    if (data.error) {
                        console.error('[前端] 错误:', data.error);
                        showError(data.error);
                        stopRecording();
                        return;
                    }
                    
                    if (data.status === 'ready') {
                        console.log('[前端] 收到ready状态，开始录音');
                        isRecording = true;
                        recordBtn.disabled = true;
                        stopBtn.disabled = false;
                        status.textContent = '正在录音...';
                        status.className = 'status recording';
                        hideError();
                        tokensDisplay.innerHTML = '';
                        tokenList = [];
                    }
                    
                    if (data.new_tokens) {
                        console.log('[前端] 收到 new_tokens:', data.new_tokens);
                        const tokens = data.new_tokens;
                        const timestamp = data.current_time || 0;
                        
                        // 添加到列表
                        tokenList.push(...tokens);
                        
                        // 更新统计
                        newTokensCount.textContent = data.token_count || tokens.length;
                        totalTokensCount.textContent = data.total_tokens || tokenList.length;
                        currentTimeEl.textContent = timestamp.toFixed(2) + 's';
                        
                        // 显示新的 tokens
                        addTokenItem(tokens, timestamp);
                    }
                    
                    if (data.index !== undefined) {
                        console.log('[前端] 收到对齐索引:', data.index);
                    }
                };
                
                websocket.onerror = (err) => {
                    console.error('[前端] WebSocket错误:', err);
                    showError('WebSocket连接错误');
                    stopRecording();
                };
                
                websocket.onclose = (event) => {
                    console.log('[前端] WebSocket连接关闭');
                    if (isRecording) {
                        stopRecording();
                    }
                };
                
            } catch (err) {
                console.error('[前端] 启动录音异常:', err);
                showError('启动录音失败: ' + err.message);
            }
        }
        
        function stopRecording() {
            console.log('[前端] 停止录音');
            isRecording = false;
            
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                console.log('[前端] 发送停止信号');
                websocket.send(JSON.stringify({ action: 'stop' }));
                websocket.close();
            }
            
            if (audioContext) {
                console.log('[前端] 关闭AudioContext');
                audioContext.close();
                audioContext = null;
            }
            
            recordBtn.disabled = false;
            stopBtn.disabled = true;
            status.textContent = '录音已停止';
            status.className = 'status ready';
        }
        
        recordBtn.addEventListener('click', startRecording);
        stopBtn.addEventListener('click', stopRecording);
    </script>
</body>
</html>
