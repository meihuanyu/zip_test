<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zipformer CTC 模型测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            background: #f5f7ff;
            border-color: #764ba2;
        }
        .upload-area.dragover {
            background: #e8ecff;
            border-color: #764ba2;
        }
        input[type="file"] {
            display: none;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
            width: 100%;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f5f7ff;
            border-radius: 8px;
            min-height: 60px;
        }
        .result-label {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        .result-text {
            color: #333;
            font-size: 18px;
            line-height: 1.6;
        }
        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin-top: 20px;
        }
        .error {
            color: #e74c3c;
            margin-top: 20px;
            padding: 10px;
            background: #ffe8e8;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Zipformer CTC 语音识别</h1>
        
        <div class="upload-area" id="uploadArea">
            <p style="font-size: 18px; color: #666; margin-bottom: 10px;">
                点击或拖拽音频文件到这里
            </p>
            <p style="font-size: 14px; color: #999;">
                支持 WAV, MP3, FLAC 等格式
            </p>
            <input type="file" id="fileInput" accept="audio/*">
        </div>
        
        <button class="btn" id="submitBtn" disabled>开始识别</button>
        
        <div class="loading" id="loading">
            <p>正在处理中...</p>
        </div>
        
        <div class="error" id="error" style="display: none;"></div>
        
        <div class="result" id="result" style="display: none;">
            <div class="result-label">识别结果：</div>
            <div class="result-text" id="resultText"></div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const resultText = document.getElementById('resultText');
        const error = document.getElementById('error');
        let selectedFile = null;

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            selectedFile = file;
            uploadArea.innerHTML = `
                <p style="font-size: 16px; color: #667eea; font-weight: bold;">
                    ✓ ${file.name}
                </p>
                <p style="font-size: 12px; color: #999; margin-top: 10px;">
                    点击重新选择
                </p>
            `;
            submitBtn.disabled = false;
            result.style.display = 'none';
            error.style.display = 'none';
        }

        submitBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('file', selectedFile);

            submitBtn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';
            error.style.display = 'none';

            try {
                const response = await fetch('/api/transcribe', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    resultText.textContent = data.text || '（无识别结果）';
                    result.style.display = 'block';
                } else {
                    error.textContent = data.detail || '识别失败';
                    error.style.display = 'block';
                }
            } catch (err) {
                error.textContent = '网络错误: ' + err.message;
                error.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
