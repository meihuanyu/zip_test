<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音素预测</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        .input-section {
            margin-bottom: 30px;
        }
        label {
            display: block;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
            min-width: 120px;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn.stop {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }
        .status {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: bold;
        }
        .status.recording {
            background: #ffe8e8;
            color: #e74c3c;
        }
        .status.ready {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .phoneme-display {
            padding: 20px;
            background: #f5f7ff;
            border-radius: 8px;
            min-height: 200px;
        }
        .phoneme-info {
            margin-bottom: 20px;
        }
        .info-item {
            padding: 12px;
            margin-bottom: 10px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .info-label {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }
        .info-value {
            font-size: 24px;
            color: #333;
            font-weight: bold;
        }
        .aligned-text {
            padding: 15px;
            background: white;
            border-radius: 8px;
            font-size: 18px;
            line-height: 1.8;
            color: #333;
        }
        .error {
            color: #e74c3c;
            margin-top: 20px;
            padding: 10px;
            background: #ffe8e8;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 音素预测</h1>
        
        <div class="input-section">
            <label for="textInput">输入英文文本：</label>
            <textarea id="textInput" placeholder="请输入要朗读的英文文本...">Good morning. This is a simple test sentence.</textarea>
        </div>
        
        <div class="controls">
            <button class="btn" id="recordBtn">开始录音</button>
            <button class="btn stop" id="stopBtn" disabled>停止录音</button>
        </div>
        
        <div class="status ready" id="status">准备就绪</div>
        
        <div class="error" id="error"></div>
        
        <div class="phoneme-display" id="phonemeDisplay">
            <div class="phoneme-info">
                <div class="info-item">
                    <div class="info-label">当前音素索引 (Token Index)</div>
                    <div class="info-value" id="tokenIndex">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">当前音素 (Current Phone)</div>
                    <div class="info-value" id="currentPhone">-</div>
                </div>
            </div>
            <div class="aligned-text" id="alignedText">
                <p style="color: #999; text-align: center;">输入文本后开始录音，对齐文本将在这里显示</p>
            </div>
        </div>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('status');
        const tokenIndexDisplay = document.getElementById('tokenIndex');
        const currentPhoneDisplay = document.getElementById('currentPhone');
        const alignedTextDisplay = document.getElementById('alignedText');
        const error = document.getElementById('error');
        
        let mediaRecorder = null;
        let audioContext = null;
        let websocket = null;
        let isRecording = false;
        
        // 初始化音频上下文
        async function initAudio() {
            try {
                console.log('[前端] 请求麦克风权限...');
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                console.log('[前端] 麦克风权限已获取');
                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: 16000
                });
                console.log('[前端] AudioContext创建成功, 采样率:', audioContext.sampleRate);
                
                const source = audioContext.createMediaStreamSource(stream);
                const processor = audioContext.createScriptProcessor(4096, 1, 1);
                
                let audioChunkCount = 0;
                processor.onaudioprocess = (e) => {
                    if (isRecording && websocket && websocket.readyState === WebSocket.OPEN) {
                        const inputData = e.inputBuffer.getChannelData(0);
                        const pcm16 = new Int16Array(inputData.length);
                        for (let i = 0; i < inputData.length; i++) {
                            const s = Math.max(-1, Math.min(1, inputData[i]));
                            pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                        }
                        websocket.send(pcm16.buffer);
                        audioChunkCount++;
                        if (audioChunkCount % 10 === 0) {
                            console.log(`[前端] 已发送 ${audioChunkCount} 个音频块`);
                        }
                    }
                };
                
                source.connect(processor);
                processor.connect(audioContext.destination);
                console.log('[前端] 音频处理器已连接');
                
                return true;
            } catch (err) {
                console.error('[前端] 初始化音频失败:', err);
                showError('无法访问麦克风: ' + err.message);
                return false;
            }
        }
        
        function showError(msg) {
            error.textContent = msg;
            error.style.display = 'block';
        }
        
        function hideError() {
            error.style.display = 'none';
        }
        
        async function startRecording() {
            console.log('[前端] 开始录音...');
            const text = textInput.value.trim();
            if (!text) {
                console.log('[前端] 错误: 文本为空');
                showError('请先输入文本');
                return;
            }
            
            if (!audioContext) {
                console.log('[前端] 初始化音频上下文...');
                const success = await initAudio();
                if (!success) {
                    console.log('[前端] 音频初始化失败');
                    return;
                }
            }
            
            try {
                // 连接WebSocket
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/api/phoneme/ws`;
                console.log('[前端] 连接WebSocket:', wsUrl);
                websocket = new WebSocket(wsUrl);
                
                websocket.onopen = () => {
                    console.log('[前端] WebSocket连接已建立');
                    // 发送参考文本
                    console.log('[前端] 发送参考文本:', text.substring(0, 50) + '...');
                    websocket.send(JSON.stringify({ text: text }));
                };
                
                websocket.onmessage = (event) => {
                    console.log('[前端] 收到WebSocket消息');
                    const data = JSON.parse(event.data);
                    console.log('[前端] 消息内容:', data);
                    
                    if (data.error) {
                        console.error('[前端] 错误:', data.error);
                        showError(data.error);
                        stopRecording();
                        return;
                    }
                    
                    if (data.status === 'ready') {
                        console.log('[前端] 收到ready状态，开始录音');
                        isRecording = true;
                        recordBtn.disabled = true;
                        stopBtn.disabled = false;
                        status.textContent = '正在录音...';
                        status.className = 'status recording';
                        hideError();
                    }
                    
                    if (data.token_index !== undefined) {
                        console.log('[前端] 收到音素信息:', data);
                        tokenIndexDisplay.textContent = data.token_index;
                        currentPhoneDisplay.textContent = data.current_phone || '-';
                        if (data.aligned_text) {
                            alignedTextDisplay.textContent = data.aligned_text;
                        }
                    }
                };
                
                websocket.onerror = (err) => {
                    console.error('[前端] WebSocket错误:', err);
                    showError('WebSocket连接错误');
                    stopRecording();
                };
                
                websocket.onclose = (event) => {
                    console.log('[前端] WebSocket连接关闭, code:', event.code, 'reason:', event.reason);
                    if (isRecording) {
                        stopRecording();
                    }
                };
                
            } catch (err) {
                console.error('[前端] 启动录音异常:', err);
                showError('启动录音失败: ' + err.message);
            }
        }
        
        function stopRecording() {
            console.log('[前端] 停止录音');
            isRecording = false;
            
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                console.log('[前端] 发送停止信号');
                websocket.send(JSON.stringify({ action: 'stop' }));
                websocket.close();
            }
            
            if (audioContext) {
                console.log('[前端] 关闭AudioContext');
                audioContext.close();
                audioContext = null;
            }
            
            recordBtn.disabled = false;
            stopBtn.disabled = true;
            status.textContent = '录音已停止';
            status.className = 'status ready';
        }
        
        recordBtn.addEventListener('click', startRecording);
        stopBtn.addEventListener('click', stopRecording);
    </script>
</body>
</html>
